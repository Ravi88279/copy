<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Same head as index.html -->
</head>
<body>
    <!-- Same navigation as index.html -->

    <!-- Contact Hero -->
    <section class="page-hero contact-hero">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Get in touch with our team of experts</p>
        </div>
    </section>

    <!-- Contact Content -->
    <section class="contact-content">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-info animate-fadeIn">
                    <h2>Our Office</h2>
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <p>123 Accounting Street, Financial District, Mumbai, India</p>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-phone"></i>
                        <p>+91 9274520379</p>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <p>info@affinityaltitudeservices.com</p>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-clock"></i>
                        <p>Monday - Friday: 9:00 AM - 6:00 PM</p>
                    </div>
                </div>
                <div class="contact-form animate-slideUp">
                    <h2>Send Us a Message</h2>
                    <form id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                        <div class="form-group">
                            <input type="text" name="name" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" name="email" placeholder="Your Email" required>
                        </div>
                        <div class="form-group">
                            <input type="tel" name="phone" placeholder="Phone Number">
                        </div>
                        <div class="form-group">
                            <select name="service" required>
                                <option value="">Select a Service</option>
                                <option value="bookkeeping">Bookkeeping</option>
                                <option value="tax">Tax Services</option>
                                <option value="consulting">Financial Consulting</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <textarea name="message" placeholder="Your Message" required></textarea>
                        </div>
                        <button type="submit" class="cta-button">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Same footer as index.html -->
    <script src="scripts/form-handler.js"></script>
</body>
</html>
